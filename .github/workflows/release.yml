name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            cpu: x64
            asset: cagent-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            cpu: arm64
            asset: cagent-linux-arm64
          - runner: macos-14
            target: bun-darwin-x64
            cpu: x64
            asset: cagent-darwin-x64
          - runner: macos-14
            target: bun-darwin-arm64
            cpu: arm64
            asset: cagent-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile --cpu=${{ matrix.cpu }}
      - run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          bun build release.ts --compile --target=${{ matrix.target }} --define CAGENT_VERSION="\"$version\"" --define CAGENT_RELEASE=true --outfile=dist/${{ matrix.asset }}
          chmod +x dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: cagent-*
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum cagent-* > SHA256SUMS)
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          previous_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..$tag"
          else
            range="$tag"
          fi

          {
            echo "## What's changed"
            echo
            declare -A sections=(
              [feat]="Features"
              [fix]="Fixes"
              [perf]="Performance"
              [docs]="Documentation"
              [chore]="Maintenance"
              [refactor]="Maintenance"
              [test]="Maintenance"
              [build]="Maintenance"
              [ci]="Maintenance"
            )
            declare -A grouped
            other=""
            conventional_commit='^([a-z]+)(\([^)]*\))?!:[[:space:]]+(.*)$'
            while IFS=$'\t' read -r subject hash; do
              [ -z "$subject" ] && continue
              if [[ "$subject" =~ $conventional_commit ]]; then
                type="${BASH_REMATCH[1]}"
                message="${BASH_REMATCH[3]}"
                if [ -n "${sections[$type]:-}" ]; then
                  grouped["${sections[$type]}"]+="- ${message} (${hash})"$'\n'
                  continue
                fi
              fi
              other+="- ${subject} (${hash})"$'\n'
            done < <(git log "$range" --no-merges --pretty=format:'%s%x09%h')
            for title in Features Fixes Performance Documentation Maintenance; do
              if [ -n "${grouped[$title]:-}" ]; then
                echo "### $title"
                printf '%s' "${grouped[$title]}"
                echo
              fi
            done
            echo "### Other changes"
            if [ -n "$other" ]; then printf '%s' "$other"; else echo "- See the commit history for details."; fi
            echo
            echo "## Checksums"
            echo
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
          } > release-notes.md
          cat release-notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/cagent-* dist/SHA256SUMS --verify-tag --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
