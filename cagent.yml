model: openai/gpt-5.6-luna
permissions: false
plugins:
  - name: mcp
    path: ./plugins/mcp
  - name: stub
    path: ./plugins/stub
  - name: bash
    path: ./plugins/bash
    config:
      timeout_ms: 30000
  - name: llama.cpp
    path: ./plugins/llama.cpp
    config:
      url: http://localhost:8080
  - name: openai
    path: ./plugins/openai
  - name: code-tools
    path: ./plugins/code-tools
  - name: claude-agents
    path: ./plugins/claude-agents
  - name: codex-agents
    path: ./plugins/codex-agents
  - name: claude-commands
    path: ./plugins/claude-commands
  - name: claude-hooks
    path: ./plugins/claude-hooks
  - name: codex-prompts
    path: ./plugins/codex-prompts
